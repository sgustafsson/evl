<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vokabeltrainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Heller Modus (Standard). */
        body {
            background-color: #c7ccd4;
        }

        /* Dunkler Modus: eigene Hintergrund- und Kartenfarben. */
        [data-bs-theme="dark"] body {
            background-color: rgb(21, 23, 25);
        }

        [data-bs-theme="dark"] .card {
            background-color: rgb(31, 39, 46);
        }

        [data-bs-theme="dark"] .flip-card-front {
            background: rgb(31, 39, 46);
        }

        /* Bessere Kontraste für die Einträge der Auswahlfelder im dunklen Modus. */
        [data-bs-theme="dark"] .form-select option {
            background-color: rgb(31, 39, 46);
            color: #e9ecef;
        }

        [data-bs-theme="dark"] .form-select option:checked,
        [data-bs-theme="dark"] .form-select option:hover {
            background-color: var(--bs-primary);
            color: #fff;
        }

        /* Umklappbare Karte für den Übersetzen-Modus. */
        .flip-card {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 200px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border-radius: var(--bs-border-radius-lg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-card-front {
            background: #fff;
            border: 1px solid var(--bs-border-color);
        }

        .flip-card-back {
            background: var(--bs-primary);
            color: #fff;
            transform: rotateY(180deg);
        }

        .flip-card-term {
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
        }

        .flip-card-lang {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 0.25rem;
        }
    </style>
</head>

<body>
    <main class="container py-5" style="max-width: 700px">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Englisch Vokabeltrainer</h1>
            <button id="themeToggle" type="button" class="btn btn-outline-secondary"
                aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten">
                <span id="themeIcon">🌙</span>
            </button>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-md-4">
                <label for="trainMode" class="form-label">Übungsmodus</label>
                <select id="trainMode" class="form-select">
                    <option value="type">Tippen</option>
                    <option value="translate">Übersetzen</option>
                </select>
            </div>

            <div class="col-sm-6 col-md-4" id="directionWrap" hidden>
                <label for="direction" class="form-label">Richtung</label>
                <select id="direction" class="form-select">
                    <option value="en-de">Englisch → Deutsch</option>
                    <option value="de-en">Deutsch → Englisch</option>
                </select>
            </div>

            <div class="col-sm-6 col-md-4">
                <label for="mode" class="form-label">Reihenfolge</label>
                <select id="mode" class="form-select">
                    <option value="order">Dateireihenfolge</option>
                    <option value="alpha">Alphabetisch</option>
                    <option value="random">Zufällig</option>
                </select>
            </div>

            <div class="col-sm-6 col-md-4">
                <label for="count" class="form-label">Anzahl Vokabeln</label>
                <input id="count" type="number" class="form-control" min="1" step="1">
                <div id="countHint" class="form-text"></div>
            </div>
        </div>

        <section class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span id="counter" class="text-secondary">Lade Vokabeln …</span>
                    <span id="feedback" aria-live="polite"></span>
                </div>

                <div class="progress mb-4" role="progressbar" aria-label="Lernfortschritt" aria-valuemin="0"
                    aria-valuemax="100">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>

                <!-- Tippen-Modus -->
                <div id="typeSection">
                    <div class="text-center mb-4">
                        <div class="text-secondary small mb-1">Tippe die Vokabel ab:</div>
                        <div id="word" class="fs-2 fw-semibold"></div>
                    </div>

                    <label for="answer" class="form-label">Deine Eingabe</label>
                    <input id="answer" type="text" class="form-control form-control-lg" autocomplete="off"
                        autocapitalize="off" spellcheck="false" disabled>

                    <div id="message" class="form-text mt-2">
                        Die Eingabe wird Buchstabe für Buchstabe geprüft.
                    </div>
                </div>

                <!-- Übersetzen-Modus -->
                <div id="cardSection" hidden>
                    <div class="flip-card mb-4" id="flipCard">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <div class="flip-card-lang" id="frontLang"></div>
                                <div class="flip-card-term" id="frontTerm"></div>
                            </div>
                            <div class="flip-card-back">
                                <div class="flip-card-lang" id="backLang"></div>
                                <div class="flip-card-term" id="backTerm"></div>
                            </div>
                        </div>
                    </div>

                    <div class="text-secondary small text-center mb-3">
                        Tippe auf die Karte, um die Übersetzung zu sehen.
                    </div>

                    <div class="d-flex justify-content-between">
                        <button id="prevCard" class="btn btn-outline-secondary" disabled>← Zurück</button>
                        <button id="nextCard" class="btn btn-primary">Weiter →</button>
                    </div>
                </div>
            </div>
        </section>

        <button id="restart" class="btn btn-outline-secondary mt-3" disabled>
            Neu starten
        </button>
    </main>

    <!-- Belohnungs-Modal: erscheint nach je 5 geschafften Vokabeln. -->
    <div class="modal fade" id="rewardModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-body p-4">
                    <img id="rewardAvatar" alt="Belohnungs-Avatar" width="120" height="120" class="mb-3">
                    <h5 class="mb-1">Super gemacht! 🎉</h5>
                    <p id="rewardText" class="text-secondary mb-3"></p>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Weiter</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            /* ---------- Hell/Dunkel-Modus ---------- */

            function applyTheme(theme) {
                $("html").attr("data-bs-theme", theme);
                $("#themeIcon").text(theme === "dark" ? "☀️" : "🌙");
            }

            // Gespeicherte Wahl laden, sonst der Systemeinstellung folgen.
            let savedTheme = localStorage.getItem("theme");
            if (!savedTheme) {
                savedTheme = window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            applyTheme(savedTheme);

            $("#themeToggle").on("click", function () {
                const next = $("html").attr("data-bs-theme") === "dark" ? "light" : "dark";
                applyTheme(next);
                localStorage.setItem("theme", next);
            });

            /* ---------- Belohnung nach je 5 Vokabeln ---------- */

            const rewardModal = new bootstrap.Modal(document.getElementById("rewardModal"));

            // Auswahl von DiceBear-Avatarstilen (https://www.dicebear.com/).
            const AVATAR_STYLES = [
                "adventurer", "avataaars", "bottts", "fun-emoji", "lorelei",
                "micah", "miniavs", "open-peeps", "personas", "thumbs"
            ];

            function celebrate(completed) {
                const style = AVATAR_STYLES[Math.floor(Math.random() * AVATAR_STYLES.length)];
                const seed = Math.random().toString(36).slice(2);
                $("#rewardAvatar").attr("src",
                    "https://api.dicebear.com/9.x/" + style + "/svg?seed=" + seed);
                $("#rewardText").text(completed + " Vokabeln geschafft!");
                rewardModal.show();
            }

            // Nach dem Schließen wieder das Eingabefeld fokussieren (Tippen-Modus).
            $("#rewardModal").on("hidden.bs.modal", function () {
                if (trainMode() === "type") $("#answer").trigger("focus");
            });

            let words = [];      // [{ en, de }, …]
            let sequence = [];
            let currentIndex = 0;
            let nextTimer = null;

            function trainMode() {
                return $("#trainMode").val();
            }

            function makeSequence() {
                sequence = [...words];

                const order = $("#mode").val();

                if (order === "alpha") {
                    // Alphabetisch nach dem englischen Begriff.
                    sequence.sort((a, b) => a.en.localeCompare(b.en, "en"));
                } else if (order === "random") {
                    // Zufällige Reihenfolge ohne Wiederholungen innerhalb eines Durchgangs.
                    for (let i = sequence.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [sequence[i], sequence[j]] = [sequence[j], sequence[i]];
                    }
                }

                // Nach dem Sortieren/Mischen auf die gewünschte Anzahl kürzen.
                sequence = sequence.slice(0, clampedCount());

                currentIndex = 0;
                render();
            }

            // Liest die Anzahl-Eingabe und begrenzt sie auf 1 … Anzahl der Vokabeln.
            function clampedCount() {
                const max = words.length;
                let n = parseInt($("#count").val(), 10);
                if (isNaN(n)) n = max;
                return Math.max(1, Math.min(n, max));
            }

            function updateProgress() {
                $("#counter").text((currentIndex + 1) + " von " + sequence.length);
                const percent = Math.round((currentIndex / sequence.length) * 100);
                $("#progressBar").css("width", percent + "%").attr("aria-valuenow", percent);
            }

            function showDone(text) {
                $("#counter").text(sequence.length + " von " + sequence.length);
                $("#progressBar").css("width", "100%").attr("aria-valuenow", 100);
                $("#feedback").text("🎉");
            }

            function render() {
                clearTimeout(nextTimer);
                $("#feedback").text("");

                if (trainMode() === "translate") {
                    $("#typeSection").prop("hidden", true);
                    $("#cardSection").prop("hidden", false);
                    showCurrentCard();
                } else {
                    $("#cardSection").prop("hidden", true);
                    $("#typeSection").prop("hidden", false);
                    showCurrentWord();
                }
            }

            /* ---------- Tippen-Modus ---------- */

            function showCurrentWord() {
                $("#answer").removeClass("is-valid is-invalid").val("");
                $("#message").text("Die Eingabe wird Buchstabe für Buchstabe geprüft.");

                if (currentIndex >= sequence.length) {
                    $("#word").text("Geschafft!");
                    $("#answer").prop("disabled", true);
                    $("#message").text("Du hast alle Vokabeln geschafft.");
                    showDone();
                    return;
                }

                $("#answer").prop("disabled", false).trigger("focus");
                $("#word").text(sequence[currentIndex].en);
                updateProgress();
            }

            $("#answer").on("input", function () {
                const answer = $(this).val();
                const target = sequence[currentIndex];

                if (target === undefined) return;

                // Groß- und Kleinschreibung wird beim Prüfen ignoriert.
                const typed = answer.toLocaleLowerCase();
                const expected = target.en.toLocaleLowerCase();

                if (expected.startsWith(typed)) {
                    $(this).removeClass("is-invalid");

                    if (typed === expected) {
                        $(this).removeClass("is-invalid").addClass("is-valid");
                        $("#feedback").text("Richtig!");

                        nextTimer = setTimeout(function () {
                            currentIndex++;
                            showCurrentWord();
                            // Nach je 5 geschafften Vokabeln eine Belohnung zeigen.
                            if (currentIndex % 5 === 0 && currentIndex < sequence.length) {
                                celebrate(currentIndex);
                            }
                        }, 500);
                    } else {
                        $(this).removeClass("is-valid");
                        $("#feedback").text("");
                    }
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    $("#feedback").text("Noch einmal versuchen.");
                }
            });

            /* ---------- Übersetzen-Modus ---------- */

            function showCurrentCard() {
                $("#flipCard").removeClass("flipped");

                const pair = sequence[currentIndex];
                if (pair === undefined) return;

                const enToDe = $("#direction").val() === "en-de";
                const front = enToDe ? pair.en : pair.de;
                const back = enToDe ? pair.de : pair.en;

                $("#frontLang").text(enToDe ? "Englisch" : "Deutsch");
                $("#frontTerm").text(front);
                $("#backLang").text(enToDe ? "Deutsch" : "Englisch");
                $("#backTerm").text(back);

                $("#prevCard").prop("disabled", currentIndex === 0);
                $("#nextCard").text(currentIndex === sequence.length - 1 ? "Fertig" : "Weiter →");

                updateProgress();
            }

            $("#flipCard").on("click", function () {
                $(this).toggleClass("flipped");
            });

            $("#nextCard").on("click", function () {
                if (currentIndex < sequence.length - 1) {
                    currentIndex++;
                    showCurrentCard();
                    // Nach je 5 durchgearbeiteten Karten eine Belohnung zeigen.
                    if (currentIndex % 5 === 0) {
                        celebrate(currentIndex);
                    }
                } else {
                    showDone();
                    $("#feedback").text("🎉 Geschafft!");
                }
            });

            $("#prevCard").on("click", function () {
                if (currentIndex > 0) {
                    currentIndex--;
                    showCurrentCard();
                }
            });

            /* ---------- Steuerung ---------- */

            $("#trainMode").on("change", function () {
                $("#directionWrap").prop("hidden", trainMode() !== "translate");
                if (words.length) makeSequence();
            });

            $("#direction").on("change", function () {
                if (words.length && trainMode() === "translate") showCurrentCard();
            });

            $("#mode").on("change", function () {
                if (words.length) makeSequence();
            });

            $("#count").on("change", function () {
                // Eingabe auf den gültigen Bereich zurückschreiben und neu starten.
                $(this).val(clampedCount());
                if (words.length) makeSequence();
            });

            $("#restart").on("click", function () {
                if (words.length) makeSequence();
            });


            $.get("vokabeln/liste.txt")
                .done(function (data) {
                    words = data
                        .split(/\r?\n/)
                        .map(line => line.trim())
                        .filter(line => line.length > 0)
                        .map(line => {
                            // Trennzeichen zwischen Englisch und Deutsch ist ";".
                            const sep = line.indexOf(";");
                            if (sep === -1) {
                                return { en: line, de: line };
                            }
                            return {
                                en: line.slice(0, sep).trim(),
                                de: line.slice(sep + 1).trim()
                            };
                        });

                    if (words.length === 0) {
                        $("#counter").text("Keine Vokabeln gefunden.");
                        $("#message").text("Füge Vokabeln in vokabeln/liste.txt ein.");
                        return;
                    }

                    $("#restart").prop("disabled", false);

                    // Anzahl-Eingabe auf die geladene Vokabelzahl einstellen (Standard: alle).
                    $("#count").attr("max", words.length).val(words.length);
                    $("#countHint").text("1 … " + words.length);

                    makeSequence();
                })
                .fail(function () {
                    $("#counter").text("Datei konnte nicht geladen werden.");
                    $("#message").text(
                        "Prüfe, ob vokabeln/liste.txt vorhanden ist und die Seite über einen Webserver geöffnet wurde."
                    );
                });
        });
    </script>
</body>

</html>
